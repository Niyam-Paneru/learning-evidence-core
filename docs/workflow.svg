<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Learning evidence mastery-state timeline</title>
  <desc id="desc">A concrete example moves from assisted practice to one independent success, then a second spaced independent success, durable mastery, and later refresh due. The diagram also lists the configurable default thresholds used by the code.</desc>

  <rect width="1200" height="440" fill="#fbfbf8"/>

  <text x="64" y="58" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.4" fill="#667085">LEARNING EVIDENCE CORE</text>
  <text x="64" y="96" font-family="Georgia, serif" font-size="31" fill="#111827">One skill, four evidence states over time</text>
  <text x="64" y="124" font-family="Arial, sans-serif" font-size="15" fill="#667085">Concrete timestamps below use the defaults in mastery.py.</text>

  <line x1="112" y1="220" x2="1086" y2="220" stroke="#98a2b3" stroke-width="2"/>
  <path d="M1086 220 l-11 -7 v14 z" fill="#98a2b3"/>

  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="220" r="11" fill="#475467"/>
    <text x="150" y="181" text-anchor="middle" font-size="13" fill="#667085">2026-01-01</text>
    <text x="150" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#344054">assisted correct</text>
    <text x="150" y="278" text-anchor="middle" font-size="14" fill="#667085">help_level = 1</text>
    <text x="150" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#475467">PRACTICE</text>

    <circle cx="430" cy="220" r="11" fill="#2e5d7b"/>
    <text x="430" y="181" text-anchor="middle" font-size="13" fill="#667085">2026-01-02</text>
    <text x="430" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#344054">independent correct</text>
    <text x="430" y="278" text-anchor="middle" font-size="14" fill="#667085">success 1 of 2</text>
    <text x="430" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#2e5d7b">QUALIFIED</text>

    <circle cx="710" cy="220" r="11" fill="#356859"/>
    <text x="710" y="181" text-anchor="middle" font-size="13" fill="#667085">2026-01-04</text>
    <text x="710" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#344054">independent correct</text>
    <text x="710" y="278" text-anchor="middle" font-size="14" fill="#667085">success 2; 2-day spacing</text>
    <text x="710" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#356859">DURABLE</text>

    <circle cx="990" cy="220" r="11" fill="#7a4f2f"/>
    <text x="990" y="181" text-anchor="middle" font-size="13" fill="#667085">2026-02-10</text>
    <text x="990" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#344054">no new qualifying attempt</text>
    <text x="990" y="278" text-anchor="middle" font-size="14" fill="#667085">37 days since latest success</text>
    <text x="990" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4f2f">REFRESH_DUE</text>
  </g>

  <line x1="64" y1="350" x2="1136" y2="350" stroke="#d0d5dd" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#475467">
    <text x="64" y="382"><tspan font-weight="700">Defaults:</tspan> 2 independent successes · minimum spacing 1 day · refresh after 30 days</text>
    <text x="64" y="407">Configurable software rules, not universal claims about how quickly people learn or forget.</text>
    <text x="64" y="431">Assisted project completion does not auto-promote mastery.</text>
  </g>
</svg>
