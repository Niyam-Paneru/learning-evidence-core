<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Learning evidence workflow</title>
<desc id="d">Attempts are classified by help level, then repeated independent success and spacing determine mastery.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Watching the tutorial is not the same as doing the thing.</text>
<path d="M92 175 H1110" stroke="#273449" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(115)"><circle cy="175" r="27" fill="#60a5fa"/><text y="182" font-size="18" font-weight="700">1</text><text y="225" fill="#dbeafe" font-size="14">attempt</text></g>
  <g transform="translate(320)"><circle cy="175" r="27" fill="#38bdf8"/><text y="182" font-size="18" font-weight="700">2</text><text y="225" fill="#dbeafe" font-size="14">help level</text></g>
  <g transform="translate(525)"><circle cy="175" r="27" fill="#22d3ee"/><text y="182" font-size="18" font-weight="700">3</text><text y="225" fill="#cffafe" font-size="14">evidence kind</text></g>
  <g transform="translate(730)"><circle cy="175" r="27" fill="#a78bfa"/><text y="182" font-size="18" font-weight="700">4</text><text y="225" fill="#ede9fe" font-size="14">repeat + space</text></g>
  <g transform="translate(935)"><circle cy="175" r="27" fill="#4ade80"/><text y="182" font-size="18" font-weight="700">5</text><text y="225" fill="#dcfce7" font-size="14">durable?</text></g>
</g>
<path d="M320 145 C350 95 485 95 525 145" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"/>
<text x="423" y="94" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">material help → practice</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">No black belt for three YouTube tabs.</text>
</svg>