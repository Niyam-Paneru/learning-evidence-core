<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Durable learning evidence diagram</title><desc id="d">Independent, repeated, and spaced evidence overlap to indicate durable mastery.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">LEARNING EVIDENCE</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">Mastery lives in the overlap, not in the XP bar.</text>
<circle cx="455" cy="292" r="150" fill="#e4edb0" fill-opacity=".82" stroke="#596e35" stroke-width="2"/>
<circle cx="625" cy="292" r="150" fill="#dce9de" fill-opacity=".82" stroke="#4f7555" stroke-width="2"/>
<circle cx="540" cy="385" r="150" fill="#f1d9dc" fill-opacity=".82" stroke="#a4243b" stroke-width="2"/>
<text x="385" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">independent</text><text x="385" y="271" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">no material help</text>
<text x="695" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">repeated</text><text x="695" y="271" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">more than one success</text>
<text x="540" y="451" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">spaced over time</text>
<circle cx="540" cy="326" r="55" fill="#171714"/><text x="540" y="322" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.3">DURABLE</text><text x="540" y="344" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12">for now</text>
<text x="1110" y="455" text-anchor="end" fill="#71716a" font-family="Arial,sans-serif" font-size="14">assisted success still counts — as practice</text>
</svg>