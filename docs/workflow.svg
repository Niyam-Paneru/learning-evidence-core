<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Learning evidence architecture</title><desc id="d">Attempts are classified as practice or qualifying evidence, then spacing and repetition determine durable mastery.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">LEARNING EVIDENCE CORE</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Practice is useful. It is not secretly mastery.</text>

<rect x="58" y="180" width="180" height="88" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="80" y="210" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ATTEMPT</text>
<text x="80" y="240" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">correct / wrong</text>

<rect x="310" y="142" width="230" height="164" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="335" y="176" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">CLASSIFY</text>
<text x="335" y="208" fill="#171714" font-family="Georgia,serif" font-size="24">How much help?</text>
<rect x="335" y="232" width="85" height="38" rx="10" fill="#f1d9dc"/><text x="377" y="256" text-anchor="middle" fill="#a4243b" font-family="Arial,sans-serif" font-size="13" font-weight="700">practice</text>
<rect x="435" y="232" width="80" height="38" rx="10" fill="#dce9de"/><text x="475" y="256" text-anchor="middle" fill="#4f7555" font-family="Arial,sans-serif" font-size="13" font-weight="700">qualify</text>

<rect x="625" y="142" width="220" height="164" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="650" y="176" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">MASTERY CHECK</text>
<text x="650" y="208" fill="#171714" font-family="Georgia,serif" font-size="24">Enough evidence?</text>
<text x="650" y="245" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">independent</text>
<text x="650" y="270" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">repeated + spaced</text>

<rect x="930" y="180" width="205" height="88" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="955" y="210" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">STATE</text>
<text x="955" y="240" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">durable / refresh</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M238 224 H310"/><path d="M540 224 H625"/><path d="M845 224 H930"/></g>
<g fill="#171714"><path d="M302 218 l10 6 -10 6z"/><path d="M617 218 l10 6 -10 6z"/><path d="M922 218 l10 6 -10 6z"/></g>

<rect x="310" y="365" width="535" height="70" rx="14" fill="#262722"/>
<text x="335" y="394" fill="#d8d8d1" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">IMPORTANT</text>
<text x="335" y="420" fill="#fff" font-family="Georgia,serif" font-size="19">Assisted success still counts. Just under the honest label.</text>
</svg>